# TCC2 - Observability Engineering Framework (Docker Compose)
# Valide antes de subir:  docker compose config -q
# Ordem recomendada de subida (Etapas 3 e 4): ver docs/runbooks/deployment.md
#
# Portas publicadas no host:
#   10.10.10.1:8080 -> NGINX (UNICA porta exposta na rede do laboratorio, cabo dedicado)
#   127.0.0.1:3000/9090/3100/3200 -> Grafana/Prometheus/Loki/Tempo (acesso por tunel SSH)
#   Node Exporter usa a rede do host na porta 9100 (somente leitura de metricas do host).
# Versoes fixadas por tag; depois do 1o pull registre os digests (docker compose images).

name: tcc2

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  api:
    build:
      context: ./app
    image: tcc2-api:${APP_VERSION:-dev}
    environment:
      OTEL_SERVICE_NAME: tcc2-api
      APP_VERSION: ${APP_VERSION:-dev}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      ENABLE_TEST_ROUTES: ${ENABLE_TEST_ROUTES:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: ${API_IPV4:-172.30.0.10}
    logging: *default-logging

  nginx:
    image: nginx:1.30.5
    ports:
      - "${LAB_BIND_IP:-10.10.10.1}:8080:8080"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [lab]
    logging: *default-logging

  collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/${COLLECTOR_CONFIG:-collector.yaml}"]
    volumes:
      - ./config/otel-collector:/etc/otelcol:ro
    mem_limit: 512m
    restart: unless-stopped
    networks: [lab]
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks: [lab]
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    networks: [lab]
    logging: *default-logging

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    user: "0"   # simplifica permissoes do volume local (laboratorio)
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped
    networks: [lab]
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_USERS_DEFAULT_THEME: light
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: utc
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped
    networks: [lab]
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    logging: *default-logging

networks:
  lab:
    ipam:
      config:
        - subnet: ${LAB_DOCKER_SUBNET:-172.30.0.0/24}

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
