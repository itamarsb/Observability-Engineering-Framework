# NGINX - ponto de entrada unico da carga (porta 8080), proxy para a API.
# Este arquivo e incluido no contexto http da imagem oficial (conf.d/).

log_format tcc2 escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
  '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"upstream_response_time":"$upstream_response_time",'
  '"upstream_connect_time":"$upstream_connect_time","run_id":"$http_x_run_id",'
  '"user_agent":"$http_user_agent"}';

upstream api_upstream {
    # A API tem IP fixo na rede do Compose (ver compose.yaml), o nome resolve sempre igual.
    server api:8000;
    keepalive 16;              # conexoes persistentes com a API (afeta o cenario C6)
    keepalive_timeout 60s;     # menor que o --timeout-keep-alive do Uvicorn (75 s)
}

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log tcc2;   # na imagem oficial vai para o stdout

    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Run-ID $http_x_run_id;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;      # maior que o timeout do k6 (2 s): quem decide a falha e o cliente
        proxy_next_upstream off;    # sem novas tentativas automaticas
        proxy_cache off;
    }
}
