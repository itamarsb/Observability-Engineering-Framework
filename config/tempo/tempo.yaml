# Tempo 3.x em modo monolitico (-target=all), armazenamento local.
# Nao requer Kafka neste modo. Recebe OTLP/gRPC na porta 4317 (enviado pelo Collector).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9096
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

backend_worker:
  compaction:
    block_retention: 2160h       # 90 dias

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
