# Prometheus - TCC2. Valide com: promtool check config prometheus.yml
# Retencao definida na linha de comando (compose.yaml): --storage.tsdb.retention.time=90d
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  # Metricas da API (http.server.request.duration) expostas pelo Collector.
  # honor_labels mantem job="tcc2-api" vindo do service.name.
  - job_name: app-via-collector
    honor_labels: true
    static_configs:
      - targets: ["collector:8889"]

  # Saude interna do Collector (itens recebidos, enviados, recusados, filas).
  - job_name: otel-collector
    static_configs:
      - targets: ["collector:8888"]

  # Recursos do host fisico (CPU, RAM, disco, rede) via Node Exporter em modo host.
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          host: observabilitylab

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
